<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#132F3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Handball-Duell</title>
<style>
:root{--ink:#132F3A;--paper:#FFF7E8;--sun:#FFC63A}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#132F3A;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
main{position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;overflow:hidden}
a.half{flex:1;position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;padding:22px 22px 26px;color:#fff;text-decoration:none;overflow:hidden}
a.hall{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
a.half:active .go{transform:translateY(2px)}
.beach{background:linear-gradient(180deg,#4fb9da 0%,#9fdcec 44%,#f2d79c 45%,#e3bd77 100%)}
.beach .sun{position:absolute;left:28px;top:56px;width:72px;height:72px;border-radius:50%;background:#ffd84a;box-shadow:0 0 50px #ffe58a}
.beach .wave{position:absolute;left:-10%;right:-10%;top:42%;height:14px;background:radial-gradient(circle at 12px -4px,transparent 12px,#e9f7fb 13px) 0 0/24px 14px repeat-x;opacity:.8;animation:wave 6s linear infinite}
@keyframes wave{to{transform:translateX(24px)}}
.beach .net{position:absolute;right:26px;top:32%;width:86px;height:58px;border:4px solid #fff;border-bottom:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 2px,transparent 2px 10px),repeating-linear-gradient(-45deg,rgba(255,255,255,.35) 0 2px,transparent 2px 10px)}
.hall{background:linear-gradient(180deg,#16243a 0%,#2f4a6e 36%,#c98a4a 37%,#e0a868 100%)}
.hall .lights{position:absolute;left:0;right:0;top:16px;display:flex;justify-content:space-around}
.hall .lights i{width:46px;height:8px;border-radius:4px;background:#fff6c8;box-shadow:0 0 22px 6px rgba(255,246,200,.55)}
.hall .area{position:absolute;left:50%;top:37%;width:190px;height:96px;margin-left:-95px;border:4px solid rgba(255,255,255,.8);border-top:0;border-radius:0 0 95px 95px}
.hall .goal{position:absolute;left:50%;top:calc(37% - 44px);width:92px;height:44px;margin-left:-46px;border:4px solid #fff;border-bottom:0;background:repeating-linear-gradient(90deg,#d12 0 12px,#fff 12px 24px) top/100% 4px no-repeat}
.half b{position:relative;font:900 34px/1.05 "Arial Black",Arial,sans-serif;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.half span{position:relative;font-size:15px;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.go{position:relative;margin-top:10px;align-self:flex-start;background:#fff;color:var(--ink);font-weight:800;border-radius:999px;padding:9px 18px;font-size:16px;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.hall .go{background:var(--sun)}
.ball{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px;border-radius:50%;z-index:3;cursor:pointer;border:3px solid var(--ink);
  background:radial-gradient(circle at 34% 28%,#fff 0 12%,transparent 13%),conic-gradient(from 20deg,#ffd23a 0 25%,#1f6fd1 0 50%,#ffd23a 0 75%,#1f6fd1 0);
  box-shadow:0 8px 16px rgba(0,0,0,.45);animation:swing 3.2s ease-in-out infinite}
@keyframes swing{0%,100%{transform:translateX(-70px) rotate(-40deg)}50%{transform:translateX(70px) rotate(40deg)}}
.ball.shot{animation:none;transition:transform .55s cubic-bezier(.2,.8,.3,1)}
.live{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:4;max-width:calc(100% - 32px);background:rgba(19,47,58,.88);color:#fff;font-size:13px;font-weight:700;padding:7px 14px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4ee07a;margin-right:7px;box-shadow:0 0 6px #4ee07a;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.live[hidden]{display:none}
.tip{position:absolute;padding:0 12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:12px;color:rgba(255,255,255,.85);z-index:4;pointer-events:none}
@media (prefers-reduced-motion:reduce){.ball,.beach .wave,.live i{animation:none}}
</style>
</head>
<body>
<main>
  <div class="live" id="live" hidden><i></i><span id="liveTxt"></span></div>
  <a class="half beach" href="beach-duell.html"><div class="sun"></div><div class="wave"></div><div class="net"></div>
    <b>Beach-Duell</b><span>Kempa, Pirouette, Shoot-out im Sand</span><div class="go">Barfuß los ›</div></a>
  <div class="ball" id="ball" role="button" aria-label="Ball werfen: zufällig Beach oder Halle"></div>
  <a class="half hall" href="hallen-duell.html"><div class="lights"><i></i><i></i><i></i></div><div class="goal"></div><div class="area"></div>
    <b>Hallen-Duell</b><span>6 + Torwart, 7-Meter, Online-Turnier</span><div class="go">Anpfiff ›</div></a>
  <div class="tip">Tipp: Zum Home-Bildschirm hinzufügen, dann startet es wie eine App</div>
</main>
<script>
const DB = 'https://handball-duell-default-rtdb.europe-west1.firebasedatabase.app';
// Ball antippen: fliegt in eine zufällige Hälfte, dann geht es dort los
const ball = document.getElementById('ball');
ball.addEventListener('click', () => {
  const up = Math.random() < .5;
  ball.classList.add('shot'); ball.style.transform = 'translate(0,' + (up ? -42 : 42) + 'vh) rotate(' + (up ? -540 : 540) + 'deg) scale(.6)';
  setTimeout(() => { location.href = up ? 'beach-duell.html' : 'hallen-duell.html'; }, 520);
});
// Live-Zeile: Geräte heute und höchster Sieg aus der Bestenliste
(async () => {
  if (!/^https:/.test(DB)) return;
  const d = new Date(), day = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const get = p => fetch(DB + p, { cache:'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null);
  const [st, lb] = await Promise.all([get('/stats/' + day + '.json?shallow=true'), get('/lb.json')]);
  const n = st ? Object.keys(st).length : 0;
  let best = null;
  for (const g of Object.values(lb || {})) for (const e of Object.values(g || {})) if (e && e.name && e.win && (!best || e.win.d > best.win.d)) best = e;
  const parts = [];
  if (n) parts.push('Heute ' + n + (n === 1 ? ' Spieler' : ' Spieler'));
  if (best) parts.push('Höchster Sieg: ' + best.name + ' +' + best.win.d);
  if (!parts.length) return;
  document.getElementById('liveTxt').textContent = parts.join(' · ');
  document.getElementById('live').hidden = false;
})();
</script>
</body>
</html>
